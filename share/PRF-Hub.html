/* Long unbroken strings (pasted part numbers, URLs) must wrap rather than widen a card, cell or modal. */
.cardBody p,.cardBody h3,.detailColumns p,.detailColumns td,.financeTable td,.queueItem h3,.queueItem p,.comboMenu button,.audit p{overflow-wrap:anywhere;word-break:break-word}
.nativeLineTable td,.nativeLineTable textarea{overflow-wrap:anywhere}
.ruleBanner.blocked{display:flex;flex-direction:column;gap:3px;margin:12px 0;padding:12px 15px;border-left:4px solid #c0492f;background:#fbe2dc;color:#7c3324;font-size:12px}
.ruleBanner.blocked strong{font-size:12px}
.ruleBanner.info{display:flex;flex-direction:column;gap:3px;margin:12px 0;padding:12px 15px;border-left:4px solid #d8a92b;background:#fbf3dc;color:#6d5514;font-size:12px}
/* Custom entry and period tags in the searchable combobox.
 *
 * Appended as the last layer so these rules sit after the base combobox styles in layer 20. */
.comboMenu button{display:flex;align-items:center;justify-content:space-between;gap:10px}
.comboTag{flex:none;padding:2px 7px;border-radius:999px;background:var(--mint);color:var(--teal-dark);font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.comboMenu button.customRow{color:var(--coral);font-weight:750}
.comboMenu button.customRow .comboTag{background:var(--coral);color:#fff}
.comboMenu button.selected .comboTag{background:var(--yellow);color:var(--ink)}
.customBadge{margin-left:7px;padding:2px 7px;border-radius:999px;background:var(--coral);color:#fff;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.comboField small{display:flex;align-items:center}
/* Notification bell, its dropdown centre, the export button, and PRF-number emphasis. */

.notificationBell{position:relative;display:flex;align-items:center}
.bellButton{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--paper);box-shadow:none;padding:0;font-size:16px;line-height:1}
.bellButton:hover{background:var(--beige)}
.bellBadge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border-radius:999px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;line-height:1}
.bellPanel{position:absolute;top:52px;right:0;z-index:60;width:min(380px,calc(100vw - 32px));max-height:min(460px,70vh);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bellPanel header{position:sticky;top:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.bellPanel header strong{font-size:13px}
.bellPanel header small{color:var(--muted);font-size:11px}
.bellPanel ul{margin:0;padding:0;list-style:none}
.bellPanel li{border-bottom:1px solid var(--line)}
.bellPanel li:last-child{border-bottom:0}
.bellPanel li.unread{background:#f6fbfb}
.bellPanel li button{width:100%;display:flex;gap:11px;align-items:flex-start;padding:13px 16px;border:0;border-radius:0;background:none;box-shadow:none;text-align:left}
.bellPanel li button:hover{background:var(--beige)}
.bellIcon{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:800;color:var(--ink)}
.bellIcon.kind-submitted{background:var(--yellow)}
.bellIcon.kind-approved{background:var(--mint)}
.bellIcon.kind-returned{background:var(--coral);color:#fff}
.bellIcon.kind-revision{background:#c9e2e5}
.bellText{display:grid;gap:3px;min-width:0}
.bellText strong{font-size:12px;line-height:1.35}
.bellText span{color:var(--muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.bellText small{color:var(--muted);font-size:10px}
.bellEmpty{margin:0;padding:26px 16px;color:var(--muted);font-size:12px;text-align:center}

.exportButton{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.exportButton:disabled{opacity:.45;cursor:not-allowed}
.exportCount{padding:1px 7px;border-radius:999px;background:var(--teal);color:#fff;font-size:10px;font-weight:800}
.exportButton.secondary .exportCount{background:var(--teal)}

/* The PRF number is the reference Finance reconciles Divvy card statements against, so it is set apart
   rather than being one more line of grey metadata. */
.prfNumber{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;border:1px dashed var(--teal);background:#eef5f6;color:var(--teal-dark);font-size:11px;font-weight:800;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.prfNumber.divvy{border-style:solid;border-color:var(--coral);background:#fdefe9;color:#8c3c22}
.prfNumber small{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.detailSummary .prfNumber{margin-top:2px}
/* The approver's review screen. */

.reviewModal{width:min(940px,100%);max-height:92vh;overflow:auto;padding-bottom:26px}
.reviewModal .modalHead>div{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.reviewModal .modalHead h2{margin:0;font-size:23px;letter-spacing:-.02em}

.reviewFacts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:0 26px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--line)}
.reviewFacts>div{display:grid;gap:3px;padding:14px 16px;background:var(--paper)}
.reviewFacts small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.12em}
.reviewFacts strong{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.reviewFacts span{color:var(--muted);font-size:11px}

.reviewModal .ruleBanner{margin:15px 26px 0}

.reviewAuthority{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:22px;margin:18px 26px 0;padding:18px 22px;border-radius:14px;background:var(--teal);color:#fff}
.reviewTotal small,.reviewTier small{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;opacity:.8}
.reviewTotal strong{display:block;margin-top:3px;font-size:32px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.reviewTier{padding-left:22px;border-left:1px solid rgba(255,255,255,.25)}
.reviewTier strong{display:block;margin-top:3px;font-size:19px;color:var(--yellow)}
.reviewTier span{display:block;margin-top:3px;font-size:11px;opacity:.9}

.reviewColumns{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;margin:22px 26px 0}
.reviewColumns h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 11px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.checklistCount{font-size:11px;font-weight:800;color:var(--teal)}
.reviewItems{width:100%;border-collapse:collapse;font-size:12px}
.reviewItems th{padding:8px 10px;background:#eef2f1;text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.reviewItems td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.reviewItems th:last-child,.reviewItems td:last-child{width:110px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.reviewItems tfoot td{border-top:2px solid var(--ink);font-weight:800}

.reviewChecklist{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.reviewChecklist label{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;cursor:pointer;font-size:12px;line-height:1.45}
.reviewChecklist input{margin-top:2px;width:15px;height:15px;accent-color:var(--teal)}
.reviewChecklist input:checked+span{color:var(--muted);text-decoration:line-through}
.checklistNote{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.5}

.reviewActions{display:flex;justify-content:flex-end;gap:12px;margin:24px 26px 0}
.approveSign{background:var(--teal)!important;color:#fff}
.approveSign:disabled{opacity:.4;cursor:not-allowed}
.rejectStart{color:var(--coral);border-color:var(--coral)!important}

.rejectPanel{margin:24px 26px 0;padding:18px 20px;border:2px solid var(--coral);border-radius:14px;background:#fdf3ef}
.rejectPanel label{display:grid;gap:8px}
.rejectPanel strong{font-size:13px}
.rejectPanel textarea{width:100%;min-height:92px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13px;line-height:1.5;resize:vertical}
.rejectActions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:13px;flex-wrap:wrap}
.rejectActions>div{display:flex;gap:10px}
.rejectActions small{font-size:11px}
.rejectActions small.required{color:var(--coral);font-weight:700}
.rejectActions small.ready{color:var(--muted)}
.rejectConfirm{background:var(--coral)!important;color:#fff}
.rejectConfirm:disabled{opacity:.4;cursor:not-allowed}

@media(max-width:820px){
  .reviewFacts{grid-template-columns:repeat(2,1fr)}
  .reviewColumns{grid-template-columns:1fr;gap:20px}
  .reviewAuthority{grid-template-columns:1fr;gap:14px}
  .reviewTier{padding-left:0;border-left:0;border-top:1px solid rgba(255,255,255,.25);padding-top:13px}
}
@media(max-width:560px){
  .reviewFacts{grid-template-columns:1fr}
  .reviewActions{flex-direction:column-reverse}
  .reviewActions button{width:100%}
}
/* The sign-in screen. */

.loginPage{display:grid;place-items:center;min-height:100vh;padding:32px 20px;background:var(--teal);background-image:radial-gradient(circle at 15% 20%,rgba(168,218,220,.28),transparent 45%),radial-gradient(circle at 85% 75%,rgba(233,196,106,.26),transparent 42%)}
.loginCard{width:min(560px,100%);padding:34px 36px 28px;border-radius:6px 26px 6px 26px;background:var(--paper);box-shadow:var(--shadow)}

.loginBrand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.loginMark{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--yellow);color:var(--ink);font-weight:900;letter-spacing:.04em}
.loginBrand strong{display:block;font-size:13px;letter-spacing:.12em;line-height:1.25}
.loginBrand small{display:block;margin-top:3px;color:var(--muted);font-size:11px}

.loginCard h1{margin:0;font-size:31px;letter-spacing:-.02em}
.loginLead{margin:7px 0 20px;color:var(--muted);font-size:13px;line-height:1.55}

.loginNotice{margin:0 0 16px;padding:11px 14px;border-radius:10px;background:#eef4f3;color:var(--teal-dark);font-size:12px;line-height:1.5}
.loginError{margin:0 0 15px;padding:11px 14px;border-left:3px solid var(--coral);border-radius:0 10px 10px 0;background:#fdf3ef;color:#8f3a20;font-size:12px;font-weight:700;line-height:1.5}

.loginCard form{display:grid;gap:15px}
.loginCard label{display:grid;gap:6px}
.loginCard label span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loginCard input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--beige);font-size:14px}
.loginCard input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.loginCard input:disabled{opacity:.6}
.loginSubmit{margin-top:4px;width:100%}
.loginSubmit:disabled{opacity:.45;box-shadow:none}

.loginSso{margin:0;padding:15px 17px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.6}

.loginPortals{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:26px 0 0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--line)}
.loginPortals>div{display:grid;gap:4px;padding:15px 16px;background:var(--beige)}
.loginPortals small{color:var(--teal-dark);font-size:9px;font-weight:800;letter-spacing:.12em}
.loginPortals strong{font-size:13px;line-height:1.3}
.loginPortals span{color:var(--muted);font-size:11px;line-height:1.5}

.loginFoot{margin:18px 0 0;color:var(--muted);font-size:11px;line-height:1.6}

/* Sign-out sits in the header's action slot, beside the notification bell. */
.signOut{border:0;background:none;box-shadow:none;padding:8px 12px;border-radius:9px;color:var(--teal-dark);font-size:12px;font-weight:800;letter-spacing:.02em}
.signOut:hover{background:#eef4f3}
.signOut:disabled{opacity:.5}

@media(max-width:560px){
  .loginCard{padding:26px 22px 22px}
  .loginPortals{grid-template-columns:1fr}
}
/* Editor footer actions, the save/failure status line, and pre-submission field validation. */

/* The delete action is docked in the footer now rather than floating over the paper. It sits at the far
   left, pushed away from the two forward actions by the auto margin, and stays quiet until hovered. */
.editorActions{justify-content:flex-start}
.editorActions .secondary{margin-left:auto}
/* The footer bar is dark ink, so the ghost treatment is drawn in light values rather than the muted grey
   used elsewhere — it has to stay legible against #26312f while still reading as the quiet option. */
.deleteDraft{
  background:transparent!important;box-shadow:none!important;
  border:1px solid rgba(255,255,255,.34)!important;color:#e8ded9!important;
}
.deleteDraft:hover,.deleteDraft:focus-visible{
  border-color:#e88a72!important;color:#ffd9cd!important;background:rgba(201,94,72,.22)!important;
}

/* A saved draft is good news. The old banner used the same coral as a validation failure, which had
   people re-saving because they thought something had gone wrong. */
.formNotice{display:flex;align-items:flex-start;gap:9px;border-radius:0 8px 8px 0;line-height:1.5}
.formNotice.isProblem{border-left:4px solid var(--coral);background:#fbe2dc;color:#7c3324}
.formNotice.isSuccess{border-left:4px solid #059669;background:#ecfdf5;color:#065f46;font-weight:600}
.formNotice.isSuccess span{font-weight:800;line-height:1.2}

/* Validation. Marks sit on the field group so the label, the control and the message move together. */
.fieldGroup{display:block}
[data-invalid="true"]{
  border-radius:9px;
  box-shadow:0 0 0 2px #ef4444;
  background:#fef2f2;
}
[data-invalid="true"] input,[data-invalid="true"] textarea,[data-invalid="true"] select{
  border-color:#ef4444!important;background:#fff;
}
.fieldError{
  margin:7px 0 0;color:#b91c1c;font-size:11px;font-weight:700;line-height:1.45;
}
.lineTableWrap[data-invalid="true"]{padding:6px}
.paymentTypes[data-invalid="true"]{padding:12px 14px}

/* The banner that appears at the top of the form when a submission is refused. */
.submitAlert{
  display:grid;gap:3px;margin:0 0 20px;padding:14px 17px;
  border:2px solid #ef4444;border-radius:10px;background:#fef2f2;color:#7f1d1d;
}
.submitAlert strong{font-size:13px}
.submitAlert span{font-size:11px;color:#b91c1c}

@media(prefers-reduced-motion:no-preference){
  [data-invalid="true"]{transition:box-shadow .18s ease,background .18s ease}
}

/* The application's own confirmation prompt, in place of window.confirm(). */
.confirmBackdrop{z-index:11500}
.confirmDialog{
  width:min(440px,calc(100vw - 36px));padding:26px 28px 22px;
  background:var(--paper);border-radius:6px 26px 6px 26px;box-shadow:var(--shadow);
}
.confirmDialog h2{margin:0 0 9px;font-size:21px;letter-spacing:-.02em}
.confirmDialog p{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}
.confirmActions{display:flex;justify-content:flex-end;gap:11px}
.confirmDestructive{background:#c9573a!important;color:#fff!important}
/* The Copy recipient block, the supporting-documents zone, and the profile settings view. */

.copyBlock{margin-top:15px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;background:var(--beige)}
.copyBlock h3{margin:0 0 10px;font-size:11px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-dark)}
.copyBlock label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin-bottom:8px;font-size:11px;font-weight:700}
.copyBlock input{width:100%;height:32px;padding:0 10px;border:1px solid #c8cfca;border-radius:7px;background:#fff;font-size:12px}
.copyBlock small{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:1.5}

.attachments{margin-top:22px}
.attachments h3{margin:0 0 11px;font-size:12px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.dropZone{
  display:grid;justify-items:center;gap:9px;padding:24px 20px;text-align:center;
  border:2px dashed #b9c3bd;border-radius:14px;background:var(--beige);
}
.dropZone.isOver{border-color:var(--teal);background:#eef4f3}
.dropZone.isDisabled{opacity:.62}
.dropZone strong{font-size:13px}
.dropZone small{color:var(--muted);font-size:11px}
.dropZone button{padding:9px 15px!important;font-size:12px}

.attachmentError{margin:11px 0 0;padding:10px 13px;border-left:3px solid var(--coral);border-radius:0 8px 8px 0;background:#fdf3ef;color:#8f3a20;font-size:11.5px;font-weight:700;line-height:1.5}

.attachmentList{margin:13px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.attachmentList li{
  display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:13px;
  padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
}
.attachmentName{font-size:12.5px;overflow-wrap:anywhere}
.attachmentSize{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Profile settings */
.profilePage{display:grid;gap:22px;max-width:860px}
.profileCard{padding:26px 28px;border:1px solid var(--line);border-radius:6px 26px 6px 26px;background:var(--paper);box-shadow:var(--shadow)}
.profileCard h2{margin:0;font-size:23px;letter-spacing:-.02em}
.profileLead{margin:7px 0 20px;color:var(--muted);font-size:13px;line-height:1.55}
.profileCard form{display:grid;gap:15px;max-width:520px}
.profileRow{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.profileCard label{display:grid;gap:6px}
.profileCard label span{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.profileCard input{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--beige);font-size:14px}
.profileFixed{display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:var(--line)}
.profileFixed>div{display:grid;gap:3px;padding:13px 15px;background:var(--beige)}
.profileFixed small{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.1em}
.profileFixed strong{font-size:13px;overflow-wrap:anywhere}
.profileFixed span{color:var(--muted);font-size:10.5px;line-height:1.45}
.profileNotice{margin:0 0 15px;padding:11px 14px;border-left:4px solid #059669;border-radius:0 8px 8px 0;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:600}
.profileError{margin:0 0 15px;padding:11px 14px;border-left:4px solid var(--coral);border-radius:0 8px 8px 0;background:#fdf3ef;color:#7c3324;font-size:12px;font-weight:600}

.directoryTable{width:100%;border-collapse:collapse;font-size:13px}
.directoryTable th{text-align:left;padding:0 12px 9px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.directoryTable td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft,#e9e7e0);vertical-align:middle}
.directoryTable tr:last-child td{border-bottom:0}
.directoryEmail{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.directoryTable select{height:34px;min-width:170px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}
.directorySelf{color:var(--muted);font-size:12px}

@media(max-width:640px){
  .profileRow,.profileFixed{grid-template-columns:1fr}
  .copyBlock label{grid-template-columns:1fr}
  .attachmentList li{grid-template-columns:1fr auto}
}

/* Two-gate lifecycle pills. The old single-gate names are kept as aliases so a stored record read forward
   from the previous model still colours correctly while it is being migrated. */
.status-pending-supervisor-approval{background:#fdf1d8;color:#7a5a12}
.status-pending-finance-review{background:#e4eef1;color:#2f5b68}
.status-needs-revision{background:#fbe2dc;color:#8f3a20}

/* Demo sign-in cheat sheet. Development and demo builds only — a real deployment renders none of this. */
.demoAccounts{margin-top:24px;padding:17px 19px;border:1px dashed var(--teal);border-radius:12px;background:var(--accent-wash,#eef3f3)}
.demoAccounts h2{margin:0 0 5px;font-size:14px;letter-spacing:-.01em}
.demoAccounts>p{margin:0 0 13px;color:var(--muted);font-size:11.5px;line-height:1.5}
.demoAccounts ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.demoAccounts li button{
  display:grid;gap:2px;width:100%;text-align:left;padding:9px 12px!important;
  background:var(--paper)!important;border:1px solid var(--line)!important;border-radius:9px!important;
  box-shadow:none!important;font-weight:600!important;
}
.demoAccounts li button:hover{border-color:var(--teal)!important;background:#fff!important}
.demoAccounts li strong{font-size:12.5px}
.demoAccounts li span{color:var(--muted);font-size:11px;font-weight:500}

/* Attached documents, shown identically in the editor, the review screen and the record. */
.documentList{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.documentList li{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
}
.documentList a,.documentStatic{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  min-width:0;color:inherit;text-decoration:none;
}
.documentList a:hover .documentName{text-decoration:underline;color:var(--teal-dark)}
.documentIcon{color:var(--teal);font-size:14px;line-height:1}
.documentName{font-size:12.5px;overflow-wrap:anywhere}
.documentSize{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.documentRemove{
  border:0!important;background:none!important;box-shadow:none!important;padding:4px 6px!important;
  color:var(--muted)!important;font-size:11px!important;font-weight:700!important;
}
.documentRemove:hover{color:#9a3928!important}
</style>
